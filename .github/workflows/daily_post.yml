name: Daily Instagram Story

on:
  workflow_dispatch:
    inputs:
      stories_count:
        description: 'Cuantas historias publicar (1-5)'
        required: false
        default: '5'
        type: string

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para commitear el historial y subir al Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar historia
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # automatico, no hace falta configurarlo
          GITHUB_REPOSITORY: ${{ github.repository }}        # automatico
          STORIES_COUNT: ${{ github.event.inputs.stories_count || '1' }}
        run: python scripts/post_story.py

      - name: Commitear historial de publicaciones
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_photos.json
          git diff --staged --quiet || git commit -m "chore: historial actualizado [skip ci]"
          git push
